[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxflow"
version = "0.1.0"
description = "Automated editorial paper-collage video workflow"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
voxflow = "voxflow.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
