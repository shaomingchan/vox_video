# VoxFlow Quick Start Configuration
# 快速开始配置（最简化版本）

[paths]
# Whiteboard 项目路径（可选）
# 如果你有 whiteboard 项目，填写其根目录路径
# 如果没有，注释掉或留空，将使用项目内置逻辑
whiteboard_root = ""

# Vox Director skill 路径（可选）
# Codex: "~/.codex/skills/vox-director"
# Claude Desktop: "~/.claude/skills/vox-director"
# 如果没有安装，注释掉或留空
vox_director_root = ""

# 项目生成目录（必需）
projects_root = "projects"

[project]
# 画面比例：9:16（竖屏）或 16:9（横屏）
aspect = "9:16"
language = "zh-CN"
shots_per_beat = 2
target_beat_seconds = 9.0

[image]
# 图片生成服务商
provider = "apimart_image2"
# 并发数（建议 3-5）
concurrency = 4

[runninghub]
# RunningHub 工作流 ID（H3 模型）
workflow_id = "2084514856253874178"
# API 模式：member（会员）或 enterprise（企业）
api_profile = "member"
# 实例类型：default 或 lite
instance_type = "default"
# 并发数：会员建议 3，企业最高 100
concurrency = 3
# 安全阈值：待确认任务超过此数量时暂停
max_unconfirmed_batch = 20
# 轮询间隔（秒）
poll_seconds = 10
# 超时时间（秒）
timeout_seconds = 1800
# 失败重试次数
retries = 2
# 输出节点 ID
output_node_id = "386"

[tts]
# TTS 并发数
concurrency = 1

[assembly]
# 视频分辨率（竖屏：1080×1920，横屏：1920×1080）
width = 1080
height = 1920
fps = 24
# 背景音乐路径（可选，留空则不添加 BGM）
bgm = ""
# BGM 音量（dB，负数越大越安静）
bgm_volume = -28
# 字幕字体大小
subtitle_fontsize = 42
# 字幕底边距（像素）
subtitle_margin_bottom = 40
