<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">VoxFlow 核心流程</title>
  <desc id="flow-desc">从输入脚本到输出视频的五个关键阶段</desc>
  
  <defs>
    <pattern id="grain-flow" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r=".9" fill="#fff" opacity=".1"/>
      <circle cx="11" cy="10" r=".7" fill="#000" opacity=".07"/>
    </pattern>
    <filter id="stage-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="26" fill="#f6ecd6"/>
  <rect width="1200" height="360" rx="26" fill="url(#grain-flow)"/>

  <!-- Title -->
  <text x="60" y="48" fill="#171615" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" letter-spacing="2.5">它如何工作 / HOW IT WORKS</text>

  <!-- Stage 1: Plan -->
  <g transform="translate(60 85)" filter="url(#stage-shadow)">
    <rect width="160" height="200" rx="10" fill="#b3201d"/>
    <text x="16" y="30" fill="#f6ecd6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" opacity=".7">01</text>
    <text x="16" y="65" fill="#fffaf0" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="900">分镜</text>
    <text x="16" y="100" fill="#f6ecd6" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" line-height="1.6">
      <tspan x="16" dy="0">拆句估时</tspan>
      <tspan x="16" dy="26">运镜规划</tspan>
      <tspan x="16" dy="26">提示词生成</tspan>
    </text>
    <circle cx="16" cy="180" r="5" fill="#f6ecd6" opacity=".8"/>
    <circle cx="32" cy="180" r="5" fill="#f6ecd6" opacity=".6"/>
    <circle cx="48" cy="180" r="5" fill="#f6ecd6" opacity=".4"/>
  </g>

  <!-- Arrow 1 -->
  <path d="M230 185h30" stroke="#b3201d" stroke-width="4" stroke-linecap="round"/>
  <path d="m252 177 12 8-12 8" fill="none" stroke="#b3201d" stroke-width="4" stroke-linecap="round"/>

  <!-- Stage 2: Image -->
  <g transform="translate(270 85)" filter="url(#stage-shadow)">
    <rect width="160" height="200" rx="10" fill="#171615"/>
    <text x="16" y="30" fill="#88c6c8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" opacity=".9">02</text>
    <text x="16" y="65" fill="#fffaf0" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="900">关键帧</text>
    <text x="16" y="100" fill="#f6ecd6" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" line-height="1.6">
      <tspan x="16" dy="0">纸张拼贴</tspan>
      <tspan x="16" dy="26">统一比例</tspan>
      <tspan x="16" dy="26">清晰可读</tspan>
    </text>
    <rect x="16" y="172" width="128" height="8" rx="4" fill="#88c6c8" opacity=".7"/>
  </g>

  <!-- Arrow 2 -->
  <path d="M440 185h30" stroke="#b3201d" stroke-width="4" stroke-linecap="round"/>
  <path d="m462 177 12 8-12 8" fill="none" stroke="#b3201d" stroke-width="4" stroke-linecap="round"/>

  <!-- Stage 3: Motion -->
  <g transform="translate(480 85)" filter="url(#stage-shadow)">
    <rect width="160" height="200" rx="10" fill="#88c6c8"/>
    <text x="16" y="30" fill="#171615" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" opacity=".8">03</text>
    <text x="16" y="65" fill="#171615" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="900">图生视频</text>
    <text x="16" y="100" fill="#171615" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" line-height="1.6">
      <tspan x="16" dy="0">H3 并发</tspan>
      <tspan x="16" dy="26">缓存复用</tspan>
      <tspan x="16" dy="26">任务锁保护</tspan>
    </text>
    <circle cx="20" cy="178" r="7" fill="#b3201d"/>
    <circle cx="42" cy="178" r="7" fill="#b3201d"/>
    <circle cx="64" cy="178" r="7" fill="#b3201d"/>
  </g>

  <!-- Arrow 3 -->
  <path d="M650 185h30" stroke="#b3201d" stroke-width="4" stroke-linecap="round"/>
  <path d="m672 177 12 8-12 8" fill="none" stroke="#b3201d" stroke-width="4" stroke-linecap="round"/>

  <!-- Stage 4: Voice -->
  <g transform="translate(690 85)" filter="url(#stage-shadow)">
    <rect width="160" height="200" rx="10" fill="#d99b28"/>
    <text x="16" y="30" fill="#171615" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" opacity=".8">04</text>
    <text x="16" y="65" fill="#171615" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="900">口播</text>
    <text x="16" y="100" fill="#171615" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" line-height="1.6">
      <tspan x="16" dy="0">TTS 合成</tspan>
      <tspan x="16" dy="26">响度标准化</tspan>
      <tspan x="16" dy="26">字幕定位</tspan>
    </text>
    <path d="M16 170h128" stroke="#171615" stroke-width="5" stroke-dasharray="4 10" opacity=".7"/>
  </g>

  <!-- Arrow 4 -->
  <path d="M860 185h30" stroke="#b3201d" stroke-width="4" stroke-linecap="round"/>
  <path d="m882 177 12 8-12 8" fill="none" stroke="#b3201d" stroke-width="4" stroke-linecap="round"/>

  <!-- Stage 5: Export -->
  <g transform="translate(900 85)" filter="url(#stage-shadow)">
    <rect width="240" height="200" rx="10" fill="#b3201d"/>
    <text x="16" y="30" fill="#f6ecd6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" opacity=".7">05</text>
    <text x="16" y="65" fill="#fffaf0" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="900">成片输出</text>
    <text x="16" y="100" fill="#f6ecd6" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" line-height="1.6">
      <tspan x="16" dy="0">FFmpeg 本地预览</tspan>
      <tspan x="16" dy="26">ChatCut 可编辑交接</tspan>
      <tspan x="16" dy="26">MP4 · 24fps · H.264</tspan>
    </text>
    <rect x="16" y="172" width="108" height="8" rx="4" fill="#f6ecd6" opacity=".8"/>
  </g>

  <!-- Bottom note -->
  <text x="60" y="328" fill="#171615" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" opacity=".5">一条命令完成全流程 · 失败自动重试 · 已生成内容不重复付费</text>
</svg>
