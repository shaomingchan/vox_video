<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="safety-title safety-desc">
  <title id="safety-title">VoxFlow 成本保护机制</title>
  <desc id="safety-desc">缓存复用、并发限制和批次确认保护付费任务</desc>
  
  <defs>
    <pattern id="grain-safety" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1" fill="#fff" opacity=".1"/>
      <circle cx="13" cy="11" r=".8" fill="#000" opacity=".08"/>
    </pattern>
    <filter id="module-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="26" fill="#fffaf0"/>
  <rect width="1200" height="340" rx="26" fill="url(#grain-safety)"/>

  <!-- Title -->
  <text x="60" y="48" fill="#171615" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700" letter-spacing="2.5">核心特性 / KEY FEATURES</text>

  <!-- Module 1: Cache -->
  <g transform="translate(60 85)" filter="url(#module-shadow)">
    <rect width="340" height="190" rx="12" fill="#88c6c8"/>
    <g transform="translate(24 28)">
      <circle cx="20" cy="20" r="18" fill="#171615"/>
      <text x="20" y="29" text-anchor="middle" fill="#88c6c8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="900">✓</text>
      
      <text x="52" y="30" fill="#171615" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="900">智能缓存</text>
      
      <text x="0" y="72" fill="#171615" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" line-height="1.75">
        <tspan x="0" dy="0">提示词 + 比例 + 工作流指纹</tspan>
        <tspan x="0" dy="28">已生成镜头自动跳过</tspan>
        <tspan x="0" dy="28">避免重复付费任务</tspan>
      </text>

      <g transform="translate(0 140)">
        <rect width="292" height="6" rx="3" fill="#171615" opacity=".2"/>
        <rect width="218" height="6" rx="3" fill="#171615"/>
        <text x="232" y="4" fill="#171615" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">75% 命中</text>
      </g>
    </g>
  </g>

  <!-- Module 2: Concurrency -->
  <g transform="translate(430 85)" filter="url(#module-shadow)">
    <rect width="340" height="190" rx="12" fill="#171615"/>
    <g transform="translate(24 28)">
      <circle cx="20" cy="20" r="18" fill="#b3201d"/>
      <text x="20" y="29" text-anchor="middle" fill="#f6ecd6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="900">3</text>
      
      <text x="52" y="30" fill="#fffaf0" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="900">并发控制</text>
      
      <text x="0" y="72" fill="#f6ecd6" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" line-height="1.75">
        <tspan x="0" dy="0">会员 3 路 / 企业 100 路</tspan>
        <tspan x="0" dy="28">Windows Mutex + 文件锁</tspan>
        <tspan x="0" dy="28">防止终端重复提交</tspan>
      </text>

      <g transform="translate(0 140)">
        <circle cx="8" cy="0" r="7" fill="#b3201d"/>
        <circle cx="32" cy="0" r="7" fill="#b3201d"/>
        <circle cx="56" cy="0" r="7" fill="#b3201d"/>
        <circle cx="92" cy="0" r="7" fill="#88c6c8" opacity=".3"/>
        <circle cx="116" cy="0" r="7" fill="#88c6c8" opacity=".3"/>
      </g>
    </g>
  </g>

  <!-- Module 3: Batch Confirmation -->
  <g transform="translate(800 85)" filter="url(#module-shadow)">
    <rect width="340" height="190" rx="12" fill="#d99b28"/>
    <g transform="translate(24 28)">
      <circle cx="20" cy="20" r="18" fill="#171615"/>
      <text x="20" y="29" text-anchor="middle" fill="#d99b28" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="900">!</text>
      
      <text x="52" y="30" fill="#171615" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="900">批次确认</text>
      
      <text x="0" y="72" fill="#171615" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" line-height="1.75">
        <tspan x="0" dy="0">--limit 3 先验证小样</tspan>
        <tspan x="0" dy="28">--all 显式确认全量生成</tspan>
        <tspan x="0" dy="28">防止误操作大批量任务</tspan>
      </text>

      <g transform="translate(0 135)">
        <rect width="116" height="28" rx="14" fill="#171615"/>
        <text x="58" y="19" text-anchor="middle" fill="#d99b28" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700">--limit 3</text>
        
        <text x="140" y="19" fill="#171615" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" opacity=".5">→</text>
        
        <rect x="176" width="100" height="28" rx="14" fill="#171615"/>
        <text x="226" y="19" text-anchor="middle" fill="#d99b28" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700">--all</text>
      </g>
    </g>
  </g>
</svg>
